<svg viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- barely-visible paper grain, same spirit as the site's background texture -->
    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="7" stitchTiles="stitch" result="noise"/>
      <feColorMatrix in="noise" type="matrix"
        values="0 0 0 0 0.29
                0 0 0 0 0.24
                0 0 0 0 0.18
                0 0 0 0.05 0"/>
    </filter>

    <!-- staggered, slightly-tilted wordmark tile -->
    <pattern id="pateoPattern" width="240" height="150" patternUnits="userSpaceOnUse" patternTransform="rotate(-7)">
      <text x="4" y="46" font-family="'Fraunces', Georgia, 'Times New Roman', serif" font-style="italic"
            font-size="34" letter-spacing="1.5" fill="#4A3728" fill-opacity="0.13">Páteo</text>
      <text x="124" y="121" font-family="'Fraunces', Georgia, 'Times New Roman', serif" font-style="italic"
            font-size="34" letter-spacing="1.5" fill="#4A3728" fill-opacity="0.13">Páteo</text>
    </pattern>
  </defs>

  <!-- cream base -->
  <rect width="800" height="800" fill="#FAF7F2"/>

  <!-- repeating wordmark -->
  <rect width="800" height="800" fill="url(#pateoPattern)"/>

  <!-- soft grain overlay -->
  <rect width="800" height="800" filter="url(#grain)" opacity="0.55"/>

  <!-- gentle vignette so it reads as a placeholder, not a busy texture -->
  <rect width="800" height="800" fill="url(#vignette)"/>
  <defs>
    <radialGradient id="vignette" cx="50%" cy="50%" r="75%">
      <stop offset="60%" stop-color="#FAF7F2" stop-opacity="0"/>
      <stop offset="100%" stop-color="#FAF7F2" stop-opacity="0.35"/>
    </radialGradient>
  </defs>
</svg>
