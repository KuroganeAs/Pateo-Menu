# Render Blueprint — free-tier stack, no card required:
#   Render free web service (this file) + Neon free Postgres (database)
#   + Cloudinary free (image storage).
# The free instance sleeps after ~15 min idle and wakes in ~30-60s; the
# customer site's built-in fallback keeps guests unaffected.
# Values marked sync:false are entered once in the Render dashboard.
services:
  - type: web
    name: pateo-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        sync: false # Neon connection string, with the scheme changed to postgresql+psycopg://
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: menucafetaria
      - key: ADMIN_PASSWORD
        sync: false # set in the Render dashboard, never committed to the repo
      - key: CORS_ORIGINS
        value: "*" # tighten to your Vercel URLs once they exist, e.g. https://site.vercel.app,https://admin.vercel.app
